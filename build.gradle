plugins {
    id 'java'
}

group = 'com.kingbrezz'
version = '1.1.1'

description = 'Professional buy-only GUI shop powered by Vault Economy.'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
    }
}

dependencies {
    // Paper 26.2 retired the old 26.2-R0.1-SNAPSHOT coordinate.
    compileOnly('io.papermc.paper:paper-api:26.2.build.121-stable')
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'DonutShop'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes(
            'Implementation-Title': 'DonutShop',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'KingBrezz'
        )
    }
}

// Keep the normal Gradle lifecycle explicit for CI/release builds.
tasks.named('build') {
    dependsOn(tasks.named('check'))
}
