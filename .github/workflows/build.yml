name: Build DonutShop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donutshop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle --no-daemon wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Clean build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify release JAR
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/DonutShop-${{ '1.1.1' }}.jar
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'plugin.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'config.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'shop.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'lang/id.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'lang/en.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'lang/zh.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'lang/vi.yml'
          jar tf build/libs/DonutShop-${{ '1.1.1' }}.jar | grep -Fx 'lang/de.yml'

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutShop-${{ github.sha }}
          path: build/libs/DonutShop-*.jar
          if-no-files-found: error
          retention-days: 14
