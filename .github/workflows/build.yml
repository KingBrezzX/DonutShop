name: Build DonutShop
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.10.2 --distribution-type bin; fi
          chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutShop-${{ github.sha }}
          path: build/libs/DonutShop-*.jar
          if-no-files-found: error

