name: DonutShop
version: ${version}
main: com.kingbrezz.donutshop.DonutShop
author: KingBrezz
description: Professional buy-only GUI shop powered by Vault Economy.
api-version: '26.2'
softdepend:
  - Vault
commands:
  shop:
    description: Opens the DonutShop.
    usage: /shop
    aliases: [dshop]
    permission: donutshop.use
  shopedit:
    description: Opens the DonutShop editor.
    usage: /shopedit <category>
    aliases: [editshop]
    permission: donutshop.admin.shopedit
  donutshop:
    description: DonutShop administration command.
    usage: /donutshop <reload|version>
    aliases: [dsadmin]
    permission: donutshop.admin
permissions:
  donutshop.use:
    description: Allows access to the player shop.
    default: true
  donutshop.admin:
    description: Allows DonutShop administration.
    default: op
  donutshop.admin.reload:
    description: Allows DonutShop reload.
    default: op
  donutshop.admin.shopedit:
    description: Allows ShopEdit.
    default: op
