# ============================================================
# DonutShop - Production Configuration
# Author: KingBrezz
# Buy-only Vault economy shop for Paper/Bukkit.
# ============================================================

# id | en | zh | vi | de
language: en

# ------------------------------------------------------------
# Global validation / safety
# ------------------------------------------------------------
global:
  # Highest accepted inventory/shop slot index + 1.
  max-slot: 54
  # Reject malformed numeric configuration instead of silently
  # creating unsafe shop entries.
  strict-validation: true
  # Write useful startup/reload diagnostics to console.
  verbose-logging: true

# ------------------------------------------------------------
# Economy
# ------------------------------------------------------------
economy:
  provider-required: true
  currency-symbol: "$"
  decimals: 2
  # Never allow a transaction to use an invalid/negative total.
  minimum-price: 0.01

# ------------------------------------------------------------
# Player shop
# ------------------------------------------------------------
shop:
  default-amount: 1
  shift-click-amount: 16
  max-purchase-amount: 2304

  main-menu:
    title: "&8Shop"
    size: 27
    categories:
      - end
      - nether
      - gear
      - food
      - farm
    category-slots:
      - 11
      - 12
      - 13
      - 14
      - 15

  category-menu:
    size: 27
    back-slot: 0
    back-name: "&c&lBack"

  # Quantity confirmation screen shown after selecting an item.
  # Layout: red decrease controls | selected item / confirm | green increase controls.
  confirmation:
    enabled: true
    title: "&8Confirmation Menu"
    filler: GRAY_STAINED_GLASS_PANE
    decrease-material: RED_STAINED_GLASS_PANE
    increase-material: LIME_STAINED_GLASS_PANE
    decrease-64-name: "&cRemove 64"
    decrease-10-name: "&cRemove 10"
    decrease-1-name: "&cRemove 1"
    reset-name: "&cSet To 1"
    plus-1-name: "&aAdd 1"
    plus-10-name: "&aAdd 10"
    plus-64-name: "&aSet To 64"
    confirm-name: "&aConfirm"
    confirm-lore: "&fClick To Buy"
    decrease-lore:
      - "&7Current quantity: &f{quantity}"
      - "&eClick to adjust the quantity"
    increase-lore:
      - "&7Current quantity: &f{quantity}"
      - "&eClick to adjust the quantity"

  item-lore:
    buy: ""
    click: "&eLeft-click to buy from the shop &8• &eShift-click for bulk"

# ------------------------------------------------------------
# ShopEdit
# ------------------------------------------------------------
shop-edit:
  enabled: true
  permission: donutshop.admin.shopedit
  title: "&8&lShopEdit &7• &f{category}"
  size: 54
  auto-save: true
  default-price: 100.00
  allowed-slots:
    min: 9
    max: 44
  selection:
    amount: 1
    strip-price-tags: false
  help:
    title: "&b&lShopEdit Help"
    select: "&7Click an item in your inventory to select it."
    place: "&7Left-click a valid shop slot to place it."
    remove: "&7Right-click a shop slot to remove it."
    price: "&7Add &f[PRICE] 250 &7to the item's name/lore."

# ------------------------------------------------------------
# GUI protection
# ------------------------------------------------------------
protection:
  cancel-top-clicks: true
  cancel-top-drags: true
  prevent-item-taking: true
  prevent-item-placing: true
  prevent-double-click-collect: true
  prevent-hotbar-swaps: true
  prevent-number-key-swaps: true

# ------------------------------------------------------------
# Feedback
# ------------------------------------------------------------
sounds:
  enabled: true
  purchase:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    pitch: 1.2
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 0.8
    pitch: 1.0

# ------------------------------------------------------------
# Files / persistence
# ------------------------------------------------------------
persistence:
  shop-file: shop.yml
  save-on-disable: true
  create-missing-language-files: true
